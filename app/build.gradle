plugins {
    id 'com.android.application'
}

android {
    namespace 'local.headunit.swc'
    compileSdk 34

    defaultConfig {
        applicationId "local.headunit.swc"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

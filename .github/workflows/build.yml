name: Build SWC Learn APK
on:
  push:
    branches: [ swc-learn ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SwcLearn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SwcLearn-apk
          path: SwcLearn.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swc-learn-${{ github.run_number }}
          name: Кнопки пульта ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: SwcLearn.apk
          make_latest: true
